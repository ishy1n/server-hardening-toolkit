name: 2. Container Security (Trivy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  build-and-scan:
    name: Build & Scan Image
    runs-on: ubuntu-latest
    steps:
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            Dockerfile
            scripts/**

      - name: Skip if no relevant changes
        if: steps.changed-files.outputs.any_changed == 'false'
        run: |
          echo "No changes in Dockerfile or scripts/. Skipping build and scan."
          
      - name: Checkout code
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/checkout@v4

      - name: Build Docker image
        if: steps.changed-files.outputs.any_changed == 'true'
        run: docker build -t hardening-toolkit:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'hardening-toolkit:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-vuln.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Run Trivy misconfiguration scanner
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security tab
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-vuln.sarif'
          category: 'trivy-vulnerability'
      
      - name: Upload config results to GitHub Security tab
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-config.sarif'
          category: 'trivy-misconfiguration'
