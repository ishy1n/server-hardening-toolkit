---
- name: Linux hardening
  when: ansible_os_family in ['Debian', 'RedHat']
  block:
    - name: Ensure required packages (Debian)
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - auditd
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Ensure required packages (RHEL)
      ansible.builtin.dnf:
        name:
          - firewalld
          - fail2ban
          - audit
        state: present
      when: ansible_os_family == 'RedHat'

    - name: SSH hardening
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: >- 
          ^(#)?{{ item.key }}\\s
        line: "{{ item.key }} {{ item.value }}"
        validate: /usr/sbin/sshd -t -f %s
      loop:
        - {key: 'PermitRootLogin', value: '{{ ssh_permit_root_login }}'}
        - {key: 'PasswordAuthentication', value: '{{ ssh_password_authentication }}'}
        - {key: 'MaxAuthTries', value: '{{ ssh_max_auth_tries }}'}
        - {key: 'X11Forwarding', value: 'no'}
      notify: reload sshd

    - name: UFW default deny
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
      when: ansible_os_family == 'Debian'

    - name: UFW allow SSH
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp
      when: ansible_os_family == 'Debian'
      notify: reload sshd

- name: Windows hardening
  when: ansible_os_family == 'Windows'
  block:
    - name: Disable SMBv1 (registry)
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: SMB1
        data: 0
        type: dword

    - name: Disable SMB1Protocol feature
      ansible.windows.win_optional_feature:
        name: SMB1Protocol
        state: absent

    - name: RDP NLA required
      ansible.windows.win_regedit:
        path: >-
          HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
        name: UserAuthentication
        data: 1
        type: dword
