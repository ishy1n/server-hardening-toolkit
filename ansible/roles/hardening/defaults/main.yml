---
# Defaults — overridable via group_vars / host_vars / -e
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_max_auth_tries: 4

ufw_allowed_ports:
  - "{{ ssh_port }}/tcp"

fail2ban_bantime: "1h"
fail2ban_findtime: "10m"
fail2ban_maxretry: 5

# Windows
smb1_disable: true
rdp_nla_required: true
rdp_min_encryption_level: 3  # 3 = High
